<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server File Upload</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #1e1e2f;
            color: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #2c2f48;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-bottom: 2px solid #3a3d5c;
            text-shadow: 0 0 3px #00ffcc;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .upload-box {
            background-color: #2b2d3c;
            padding: 30px 40px;
            border-radius: 8px;
            border: 1px solid #3a3d5c;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #00ffcc;
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input[type="file"] {
            margin-bottom: 20px;
            padding: 5px;
            background-color: #1a1b28;
            color: #f5f5f5;
            border: 1px solid #3a3d5c;
            border-radius: 4px;
        }

        input[type="submit"] {
            background-color: #00ffcc;
            color: #1e1e2f;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        input[type="submit"]:hover {
            background-color: #00ddb0;
        }

        a {
            margin-top: 20px;
            display: block;
            text-align: center;
            color: #00ffcc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
            color: #00ddb0;
        }
    </style>
</head>
<body>
    <header>
        🖥️ Server Dashboard - File Upload
    </header>
    <main>
        <div class="upload-box">
            <h1>Upload a File</h1>
            <form method="POST" action="/upload" enctype="multipart/form-data">
                <input type="file" name="file" required>
                <input type="submit" value="Upload">
            </form>
            <a href="/files">📂 View Uploaded Files</a>
        </div>
    </main>
</body>
</html>
